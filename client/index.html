<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Road Rally</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ══ SCREEN: MAIN MENU ══════════════════════════════════════════════ -->
  <div id="screen-menu" class="screen active">
    <div class="menu-bg"></div>
    <div class="menu-content">
      <div class="title-block">
        <h1 class="game-title">ROAD RALLY</h1>
        <p class="game-subtitle">MULTIPLAYER DRIVING</p>
      </div>

      <div class="menu-card">
        <div class="field-group">
          <label for="input-name">Player Name</label>
          <input id="input-name" type="text" placeholder="Enter your name" maxlength="20" autocomplete="off" spellcheck="false">
        </div>

        <button id="btn-create" class="btn btn-primary">Create Game</button>

        <div class="divider"><span>or</span></div>

        <div class="join-row">
          <input id="input-code" type="text" placeholder="Room Code" maxlength="5" autocomplete="off" spellcheck="false" class="code-input">
          <button id="btn-join" class="btn btn-secondary">Join</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ══ SCREEN: LOBBY ══════════════════════════════════════════════════ -->
  <div id="screen-lobby" class="screen">
    <div class="lobby-layout">

      <!-- Left: vehicle selection -->
      <div class="lobby-left">
        <div class="section-header">
          <h2>Room: <span id="lobby-room-code" class="room-code-display"></span></h2>
          <p class="room-hint">Share this code with friends</p>
          <p class="room-hint spawn-city-hint">Spawning in: <span id="lobby-spawn-city" class="room-code-display"></span></p>
        </div>

        <h3 class="section-title">Choose Vehicle</h3>
        <div id="vehicle-cards" class="vehicle-cards"></div>
      </div>

      <!-- Right: players + actions -->
      <div class="lobby-right">
        <h3 class="section-title">Players <span id="lobby-player-count" class="player-count-badge">0</span></h3>
        <div id="players-list" class="players-list"></div>

        <div class="lobby-actions">
          <button id="btn-ready" class="btn btn-secondary">Ready Up</button>
          <button id="btn-start" class="btn btn-primary hidden">Start Game</button>
          <button id="btn-leave-lobby" class="btn btn-ghost">Leave</button>
        </div>
      </div>

    </div>
  </div>

  <!-- ══ SCREEN: GAME ════════════════════════════════════════════════════ -->
  <div id="screen-game" class="screen">
    <div id="map"></div>

    <!-- HUD top-left -->
    <div class="hud hud-top-left">
      <div class="hud-room">ROOM: <strong id="hud-room-code"></strong></div>
      <div class="hud-players">Players: <strong id="hud-player-count">1</strong></div>
      <div class="hud-city" id="hud-city"></div>
    </div>

    <!-- HUD bottom-left -->
    <div class="hud hud-bottom-left">
      <div id="hud-offroad" class="hud-offroad-badge" style="display:none">OFF-ROAD</div>
      <div class="hud-speed-display">
        <span id="hud-speed" class="speed-number">0</span>
        <span class="speed-unit">MPH</span>
      </div>
      <div class="hud-vehicle-name" id="hud-vehicle-name">Sedan</div>
      <div class="hud-controls">W/A/S/D · SPACE Handbrake</div>
      <div class="hud-speed-mult">
        <label for="speed-mult-slider">Speed <span id="speed-mult-value">1×</span></label>
        <input id="speed-mult-slider" type="range" min="1" max="10" step="0.5" value="1">
      </div>
    </div>

    <!-- Player list overlay top-right -->
    <div class="hud hud-top-right" id="player-list-hud">
      <div class="player-list-title">Players</div>
      <div id="hud-player-list"></div>
    </div>

    <!-- Leave button -->
    <button id="btn-leave-game" class="btn btn-ghost hud-leave-btn">Leave Game</button>
  </div>

  <!-- ══ LOADING OVERLAY ════════════════════════════════════════════════ -->
  <div id="loading" class="overlay hidden">
    <div class="spinner"></div>
    <p id="loading-text">Connecting…</p>
  </div>

  <!-- ══ TOAST NOTIFICATIONS ════════════════════════════════════════════ -->
  <div id="toast" class="toast hidden"></div>

  <!-- Load scripts in dependency order -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/input.js"></script>
  <script src="js/vehicle.js"></script>
  <script src="js/multiplayer.js"></script>
  <script src="js/map.js"></script>
  <script src="js/roads.js"></script>
  <script src="js/game.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
